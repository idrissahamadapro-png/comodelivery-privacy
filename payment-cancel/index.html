<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Paiement annulé — ComoDelivery</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FBF7F0;
      color: #1A1512;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EEE6D9;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(216, 67, 21, 0.08);
    }
    .badge {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #F3EADB;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge svg { width: 40px; height: 40px; }
    h1 {
      font-family: Georgia, 'Playfair Display', serif;
      font-size: 26px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    p { color: #5d524a; font-size: 15px; line-height: 1.5; margin-bottom: 8px; }
    .hint { color: #7A6F66; font-size: 13px; margin-top: 18px; }
    .btn {
      display: inline-block;
      margin-top: 22px;
      background: #A8200B;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 15px 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(168, 32, 11, 0.3);
    }
    .logo { margin-top: 26px; font-size: 12px; color: #b5a89c; }
    .logo a { color: #b5a89c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7A6F66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </div>
      <h1>Paiement annulé</h1>
      <p>Aucun montant n'a été débité. Retourne dans l'application ComoDelivery pour réessayer ou choisir un autre moyen de paiement.</p>
      <a class="btn" href="comodelivery://">Retour à l'app</a>
      <p class="hint">Tu peux fermer cette page en toute sécurité.</p>
      <div class="logo">© 2026 ComoDelivery · <a href="https://comodelivery.app">comodelivery.app</a></div>
    </div>
  </div>
</body>
</html>
